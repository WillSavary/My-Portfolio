<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="logo-title">
    <!-- A title gives assistive technology a useful name for the logo. -->
    <title id="logo-title">William Savary logo</title>
    <!-- The gradient colors the hand-drawn W mark. -->
    <defs>
        <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#83c1ff"/>
            <stop offset="1" stop-color="#3d86ed"/>
        </linearGradient>
    </defs>
    <!-- Rounded dark tile frames the blue W and small finishing dot. -->
    <rect x="5" y="5" width="150" height="150" rx="36" fill="#0e1420" stroke="#4f9dff" stroke-width="3"/>
    <path d="M37 48 53 111 80 66 107 111 123 48" fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round" stroke-width="13"/>
    <circle cx="127" cy="116" r="7" fill="#f2f6fc"/>
</svg>
